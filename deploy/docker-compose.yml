services:
  relay:
    image: rig-relay:local
    build:
      context: ../Api
      dockerfile: Services/Relay/Dockerfile
    ports:
      - "4433:4433"
    volumes:
      - relay-data:/data
    environment:
      Rig__Data__Path: /data/rig.db
    profiles: ["relay"]

  openbao:
    image: openbao/openbao:2.4
    command: server -dev -dev-listen-address=0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: rig-dev-only
    profiles: ["openbao"]

volumes:
  relay-data:
